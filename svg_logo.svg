  <title id="title">Nova Escola Politécnica do Huambo logo</title>
  <desc id="desc">Editable vector recreation of the supplied emblem, with CSS variables for theme colors and optional animation classes.</desc>
  <style>
    :root {
      --logo-blue: #003fd1;
      --logo-red: #e8010c;
      --logo-yellow: #ffcf00;
      --logo-black: #060606;
      --logo-opacity: 1;
      --logo-speed: 1;
    }
    .logo-blue { fill: var(--logo-blue); }
    .logo-red { fill: var(--logo-red); }
    .logo-yellow { fill: var(--logo-yellow); }
    .logo-black { fill: var(--logo-black); }
    .logo { opacity: var(--logo-opacity); }
    /* Dark-theme example: override only the variables you need. */
    @media (prefers-color-scheme: dark) {
      :root { --logo-black: #f2f2f2; }
    }
    /* Optional animation: add class="animated" to the root group. */
    .animated .logo-mark { transform-box: fill-box; transform-origin: center; animation: logo-float calc(4s / var(--logo-speed)) ease-in-out infinite; }
    .animated .logo-sun { transform-box: fill-box; transform-origin: center; animation: logo-pulse calc(3s / var(--logo-speed)) ease-in-out infinite; }
    @keyframes logo-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes logo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @media (prefers-reduced-motion: reduce) { .animated * { animation: none !important; } }
  </style>
