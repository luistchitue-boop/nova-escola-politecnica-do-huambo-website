<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Nova Escola Politécnica do Huambo emblem</title>

  <!-- Hand-traced emblem: transparent background -->

  <!-- White map-like base with blue outline (main silhouette) -->
  <path d="M110 190 C100 120 150 100 210 120 C250 135 270 140 300 130 C340 120 360 155 350 200 C346 220 352 255 330 280 C315 295 290 308 260 304 C230 300 200 308 180 295 C160 280 150 240 110 190 Z"
        fill="#ffffff" stroke="#0b66a3" stroke-width="12" stroke-linejoin="round" />

  <!-- Yellow sun behind the tower (kept) -->
  <circle cx="255" cy="255" r="36" fill="#ffd500" />

  <!-- Red stylized tower (central element) -->
  <g fill="#d31b20">
    <!-- left leg -->
    <path d="M230 100 L245 100 L288 360 L270 360 L245 180 L220 360 L200 360 Z" />
    <!-- cross band -->
    <rect x="205" y="188" width="80" height="14" rx="4" fill="#d31b20" transform="rotate(-6 245 195)" />
  </g>

  <!-- Black arch across the tower -->
  <path d="M170 320 C210 260 300 260 340 320" stroke="#111" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- thin white highlight on arch -->
  <path d="M210 288 C245 258 275 258 310 288" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Small blue diamond/top accent (keeps detail) -->
  <g transform="translate(90,70) rotate(-15)">
    <polygon points="0,0 18,-8 28,10 10,20" fill="#0b66a3" />
  </g>

</svg>
